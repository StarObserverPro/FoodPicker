<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ef" />
  <meta name="description" content="随便聊几句，猜一道你想吃的菜，再画张图。" />
  <meta property="og:title" content="今天吃什么" />
  <meta property="og:description" content="随便聊几句，猜一道你想吃的菜，再画张图。" />
  <meta property="og:image" content="/share-card.png" />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="icon" href="/assets/icon-180.png" />
  <title>今天吃什么</title>
  <link rel="stylesheet" href="/styles.css?v=43" />
  <link rel="stylesheet" href="/literary-intro.css?v=38" />
  <link rel="stylesheet" href="/landing-hotpot.css?v=38" />
  <link rel="stylesheet" href="/wake-intro.css?v=43" />
  <link rel="stylesheet" href="/chat.css?v=38" />
</head>
<body>
  <div class="shell">
    <div class="desk">
      <main class="paper" aria-live="polite">
        <section id="wakeIntro" class="wake-intro" aria-label="开场：诶，你醒了？" hidden>
          <div class="wake-scene" id="wakeScene" aria-hidden="true">
            <div class="wake-grain"></div>
            <div class="wake-orbit"></div>
            <div class="wake-wave" id="wakeWave"></div>
            <div class="wake-trace"></div>
            <div class="wake-lines" id="wakeLines"></div>
            <div class="wake-wipe" id="wakeWipe"></div>
          </div>
          <p class="wake-reader">诶，醒了？看你趴这儿半天没动，还以为你饿晕了。想好吃什么没？没想好啊，那咱俩琢磨琢磨。</p>
          <button id="wakeSkip" class="wake-skip" type="button" aria-label="跳过开场，进入今天吃什么">
            跳过<span class="wake-skip-icon" aria-hidden="true"></span>
          </button>
        </section>
        <div class="inner">
          <section id="intro" class="landing">
            <div class="landing-bg" aria-hidden="true"></div>
            <div class="landing-wash" aria-hidden="true"></div>
            <img class="landing-hotpot-art" src="/assets/landing/hotpot-mj-full-v19.webp" alt="" aria-hidden="true" style="pointer-events:none;position:absolute" />

            <div class="landing-content">
              <div class="landing-title">今 天 吃 什 么</div>

              <div class="entry-stage">
                <button class="entry-button entry-random" id="randomBtn" type="button" aria-labelledby="openingMeal openingMealPrompt">
                  <span class="dish-die" aria-hidden="true"></span>
                  <span class="dish-copy">
                    <strong id="openingMeal">随便挑一道菜</strong>
                    <span class="entry-note" id="openingMealPrompt">要不要试试这道？</span>
                  </span>
                  <span class="dish-arrow" aria-hidden="true"></span>
                </button>

                <button class="entry-button entry-think" id="startBtn" type="button" aria-labelledby="drawEntryAction" aria-describedby="drawEntryTitle drawInvitation">
                  <span class="painter-copy">
                    <strong id="drawEntryTitle">我是个画家，<br />对吃的很在行。</strong>
                    <span class="entry-note" id="drawInvitation">跟我说件今天的事，我给你画道菜。</span>
                    <span class="painter-action" id="drawEntryAction">找我聊聊</span>
                  </span>
                  <img class="painter-print" src="/assets/studio/noodle-print.webp" alt="" width="512" height="512" />
                </button>

                <div class="literary-inline" aria-live="polite">
                  <div class="literary-copy" id="literaryQuote">胡麻饼样学京都，面脆油香新出炉。</div>
                  <div class="literary-credit" id="literaryCredit">白居易 · 《寄胡饼与杨万州》</div>
                </div>
              </div>
            </div>
          </section>

          <section id="chat" class="hidden paper-flow chat-page" aria-label="聊两句，挑一顿饭">
            <div class="chat-top"><span></span><button id="chatBack" type="button">回去</button></div>
            <div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
            <div id="chatWaiting" class="chat-waiting" role="status" aria-label="AI 正在琢磨" hidden><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><small>AI 正在琢磨</small></div>
            <form id="chatForm" class="chat-form">
              <label for="chatInput" class="chat-label">随便说说</label>
              <textarea id="chatInput" rows="2" enterkeyhint="send" placeholder="" aria-describedby="chatCount chatError"></textarea>
              <div class="chat-compose"><span id="chatCount" class="chat-count">0/50</span><button id="chatSend" class="act main" type="submit" disabled>发送</button></div>
              <p id="chatError" class="chat-error" role="status"></p>
            </form>
            <button id="chatRandom" class="chat-random" type="button">算了，直接挑吧</button>
          </section>

          <section id="quiz" class="hidden paper-flow">
            <img id="quizBackground" class="quiz-background" alt="" aria-hidden="true" hidden />
            <div class="qmeta"><strong id="qStep">第 1 题 / 8</strong></div>
            <div class="progress" aria-hidden="true"><i id="prog"></i></div>
            <div class="question" id="qText"></div>
            <div class="choices" id="choices"></div>
            <button class="quiz-back" id="quizBackBtn" type="button">← 上一题</button>
          </section>

          <section id="loading" class="loading hidden paper-flow">
            <div class="coin" aria-hidden="true">食</div>
            <b>稍等，看看今天吃什么。</b>
            <p id="loadingLine">正在挑几道你可能想吃的菜。</p>
          </section>

          <section id="result" class="hidden result-clean paper-flow">
            <div class="result-hero" id="resultHero">
              <div class="result-art">
                <img id="personaBackground" class="persona-art-layer persona-background" alt="" hidden />
                <img id="personaPot" class="persona-art-layer persona-pot" alt="" hidden />
                <img id="personaCharacter" class="persona-art-layer persona-character" alt="" hidden />
                <img id="directArt" class="persona-art-layer direct-art-image" alt="" hidden />
                <div class="result-art-fallback" id="resultArtFallback" aria-hidden="true"></div>
              </div>
              <div class="persona-float" id="personaFloat">
                <div class="persona-title" id="personaTitle"></div>
                <p class="persona-verdict" id="personaVerdict"></p>
              </div>
            </div>

            <div class="result-body">
              <div class="result-decision" id="resultDecision">那今天就吃——</div>
              <div class="meal" id="mealName"></div>
              <div class="meal-native" id="mealNative"></div>
              <p class="result-verdict" id="psychVerdict"></p>
              <div class="alt-list result-alt-list" id="altList" aria-label="其他推荐"></div>

              <div class="actions result-actions">
                <button class="act main result-accept" id="acceptBtn" type="button">就它了，发张图</button>
                <button class="act" id="rerollBtn" type="button">换一个</button>
                <button class="act" id="resetProfileBtn" type="button">再来一次</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="share-modal hidden" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-sheet">
      <div class="share-sheet-head">
        <h2 id="shareModalTitle">分享图片</h2>
        <button id="closeShareBtn" aria-label="关闭分享图" type="button">×</button>
      </div>
      <div class="share-preview-wrap">
        <div class="share-loading" id="shareStatus">正在生成分享图……</div>
        <img id="sharePreview" alt="今天吃什么分享图预览" />
      </div>
      <div class="share-actions">
        <button class="act main" id="shareFileBtn" type="button">分享</button>
        <button class="act" id="downloadBtn" type="button">保存图片</button>
        <button class="act wide" id="copyLinkBtn" type="button">复制链接</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/typing.js?v=39" defer></script>
  <script src="/food-data.js?v=38" defer></script>
  <script src="/meal-parameters.js?v=38" defer></script>
  <script src="/food-policy.js?v=38" defer></script>
  <script src="/personality-engine.js?v=38" defer></script>
  <script src="/qr-code.js?v=38" defer></script>
  <script src="/persona-art.js?v=38" defer></script>
  <script src="/psychic-app.js?v=43" defer></script>
  <script src="/literary-quotes-v5.js?v=38" defer></script>
  <script src="/literary-intro.js?v=38" defer></script>
  <script src="/wake-intro.js?v=43" defer></script>
</body>
</html>
