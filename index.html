<!DOCTYPE html>
<html lang="zh-CN" class="literary-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eadb" />
  <meta name="description" content="先看你今儿啥锅，然后再看你往里搁啥。" />
  <meta property="og:title" content="今天吃什么 · 锅格食运局" />
  <meta property="og:description" content="先来一句吃的，再看看今天往锅里搁啥。" />
  <meta property="og:image" content="/share-card.png" />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="icon" href="/assets/icon-180.png" />
  <title>今天吃什么 · 锅格食运局</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/literary-intro.css" />
</head>
<body>
  <button class="literary-intro" id="literaryIntro" type="button" aria-label="点一下，进入今天吃什么">
    <span class="literary-mark" aria-hidden="true">食</span>
    <span class="literary-copy" id="literaryQuote">胡麻饼样学京都，面脆油香新出炉。</span>
    <span class="literary-credit" id="literaryCredit">白居易 · 《寄胡饼与杨万州》</span>
    <span class="literary-enter">点一下</span>
  </button>

  <div class="shell">
    <div class="desk">
      <main class="paper" aria-live="polite">
        <div class="inner">
          <section id="intro">
            <header class="mast">
              <div class="brand">
                <div class="eyebrow">扎 心 版 · 今 天 吃 什 么</div>
                <h1>先看你今儿啥锅，<br />然后再看你往里搁啥。</h1>
              </div>
              <div class="seal" aria-hidden="true">食命</div>
            </header>

            <div class="water-rule"><i></i></div>

            <div class="hero-copy">
              我管你爱吃辣还是喝汤呢？<br />先随便扯几句，看看你到底是哪口锅。
            </div>

            <aside class="shared-invite hidden" id="sharedInvite"></aside>

            <aside class="saved-profile hidden" id="savedProfile">
              <span class="saved-kicker">上回是这口锅</span>
              <strong id="savedTitle"></strong>
            </aside>

            <div class="intro-actions">
              <button class="primary" id="startBtn">来，看看啥锅</button>
              <button class="primary hidden" id="resumeBtn">今天往锅里来一卦</button>
              <button class="text-button hidden" id="retestBtn">再来一锅</button>
            </div>
          </section>

          <section id="quiz" class="hidden">
            <div class="qmeta"><strong id="qStep">第 1 题 / 8</strong></div>
            <div class="progress" aria-hidden="true"><i id="prog"></i></div>
            <div class="question" id="qText"></div>
            <div class="choices" id="choices"></div>
            <button class="quiz-back" id="quizBackBtn">← 上一题</button>
          </section>

          <section id="loading" class="loading hidden">
            <div class="coin" aria-hidden="true">锅</div>
            <b>往吃的上拐一下……</b>
            <p id="loadingLine">看看哪道菜最会来事。</p>
          </section>

          <section id="result" class="hidden result-clean">
            <div class="result-hero" id="resultHero">
              <div class="result-art" aria-hidden="true">
                <img id="personaArt" class="persona-art-image" alt="" hidden />
              </div>
              <div class="persona-float">
                <div class="persona-title" id="personaTitle"></div>
                <div class="cross-list result-cross-list" id="crossList" aria-label="相近锅格"></div>
              </div>
            </div>

            <div class="result-body">
              <div class="meal" id="mealName"></div>
              <div class="meal-native" id="mealNative"></div>
              <p class="result-verdict" id="psychVerdict"></p>
              <div class="alt-list result-alt-list" id="altList" aria-label="其他推荐"></div>

              <div class="actions compact-actions result-actions">
                <button class="act main" id="acceptBtn">就它</button>
                <button class="act" id="rerollBtn">换一个</button>
                <button class="act share" id="shareImageBtn">发张图</button>
                <button class="act wide" id="resetProfileBtn">再来一锅</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="share-modal hidden" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-sheet">
      <div class="share-sheet-head">
        <h2 id="shareModalTitle">这口锅，和今天这道菜</h2>
        <button id="closeShareBtn" aria-label="关闭分享图">×</button>
      </div>
      <div class="share-preview-wrap">
        <div class="share-loading" id="shareStatus">正在画图……</div>
        <img id="sharePreview" alt="锅格分享图预览" />
      </div>
      <div class="share-actions">
        <button class="act main" id="shareFileBtn">发出去</button>
        <button class="act" id="downloadBtn">存图片</button>
        <button class="act wide" id="copyLinkBtn">复制链接</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/food-data.js" defer></script>
  <script src="/food-policy.js" defer></script>
  <script src="/personality-engine.js" defer></script>
  <script src="/qr-code.js" defer></script>
  <script src="/psychic-app.js" defer></script>
  <script src="/literary-quotes-v5.js" defer></script>
  <script src="/literary-intro.js" defer></script>
</body>
</html>
