<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ef" />
  <meta name="description" content="饿了就看运气；还不饿，就一起想想吃啥。" />
  <meta property="og:title" content="今天吃什么" />
  <meta property="og:description" content="随便选一个，或者扯几句，看看心里其实想的是哪道菜。" />
  <meta property="og:image" content="/share-card.png" />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="icon" href="/assets/icon-180.png" />
  <title>今天吃什么</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/literary-intro.css" />
  <link rel="stylesheet" href="/landing-hotpot.css" />
</head>
<body>
  <div class="shell">
    <div class="desk">
      <main class="paper" aria-live="polite">
        <div class="inner">
          <section id="intro" class="landing">
            <div class="landing-bg" aria-hidden="true"></div>
            <div class="landing-wash" aria-hidden="true"></div>

            <div class="landing-content">
              <div class="landing-title">今 天 吃 什 么</div>

              <div class="entry-stage">
                <button class="entry-button entry-random" id="randomBtn" type="button">
                  <strong>饿了，<br />随便选一个</strong>
                  <span>看运气</span>
                </button>

                <div class="literary-inline" aria-live="polite">
                  <div class="literary-copy" id="literaryQuote">胡麻饼样学京都，面脆油香新出炉。</div>
                  <div class="literary-credit" id="literaryCredit">白居易 · 《寄胡饼与杨万州》</div>
                </div>

                <button class="entry-button entry-think" id="startBtn" type="button">
                  <strong>还不饿，<br />一起想想吃啥</strong>
                  <span>扯几句，看看心里其实想的是哪道菜</span>
                </button>
              </div>
            </div>
          </section>

          <section id="quiz" class="hidden paper-flow">
            <div class="qmeta"><strong id="qStep">第 1 题 / 8</strong></div>
            <div class="progress" aria-hidden="true"><i id="prog"></i></div>
            <div class="question" id="qText"></div>
            <div class="choices" id="choices"></div>
            <button class="quiz-back" id="quizBackBtn" type="button">← 上一题</button>
          </section>

          <section id="loading" class="loading hidden paper-flow">
            <div class="coin" aria-hidden="true">食</div>
            <b>稍等，看看今天落哪一口。</b>
            <p id="loadingLine">有几道菜已经挤到前面了。</p>
          </section>

          <section id="result" class="hidden result-clean paper-flow">
            <div class="result-hero" id="resultHero">
              <div class="result-art">
                <img id="personaBackground" class="persona-art-layer persona-background" alt="" hidden />
                <img id="personaPot" class="persona-art-layer persona-pot" alt="" hidden />
                <img id="personaCharacter" class="persona-art-layer persona-character" alt="" hidden />
                <div class="result-art-fallback" id="resultArtFallback" aria-hidden="true"></div>
              </div>
              <div class="persona-float" id="personaFloat">
                <div class="persona-title" id="personaTitle"></div>
                <p class="persona-verdict" id="personaVerdict"></p>
              </div>
            </div>

            <div class="result-body">
              <div class="result-decision" id="resultDecision">今儿不折腾了，就吃这个。</div>
              <div class="meal" id="mealName"></div>
              <div class="meal-native" id="mealNative"></div>
              <p class="result-verdict" id="psychVerdict"></p>
              <div class="alt-list result-alt-list" id="altList" aria-label="其他推荐"></div>

              <div class="actions result-actions">
                <button class="act main result-accept" id="acceptBtn" type="button">就它，发张图</button>
                <button class="act" id="rerollBtn" type="button">换一个</button>
                <button class="act" id="resetProfileBtn" type="button">从头来</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="share-modal hidden" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-sheet">
      <div class="share-sheet-head">
        <h2 id="shareModalTitle">发张图</h2>
        <button id="closeShareBtn" aria-label="关闭分享图" type="button">×</button>
      </div>
      <div class="share-preview-wrap">
        <div class="share-loading" id="shareStatus">正在画图……</div>
        <img id="sharePreview" alt="今天吃什么分享图预览" />
      </div>
      <div class="share-actions">
        <button class="act main" id="shareFileBtn" type="button">发出去</button>
        <button class="act" id="downloadBtn" type="button">存图片</button>
        <button class="act wide" id="copyLinkBtn" type="button">复制链接</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/food-data.js" defer></script>
  <script src="/food-policy.js" defer></script>
  <script src="/personality-engine.js" defer></script>
  <script src="/qr-code.js" defer></script>
  <script src="/persona-art.js" defer></script>
  <script src="/psychic-app.js" defer></script>
  <script src="/literary-quotes-v5.js" defer></script>
  <script src="/literary-intro.js" defer></script>
</body>
</html>
