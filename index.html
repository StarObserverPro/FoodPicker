<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eadb" />
  <meta name="description" content="先看你今儿啥锅，再看往里搁啥。" />
  <meta property="og:title" content="今天吃什么 · 锅格食运局" />
  <meta property="og:description" content="几道小题，算口锅，也顺手算顿饭。" />
  <meta property="og:image" content="/share-card.png" />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="icon" href="/assets/icon-180.png" />
  <title>今天吃什么 · 锅格食运局</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/screen-refresh.css" />
</head>
<body class="opening-active">
  <button
    class="literary-gate"
    id="literaryGate"
    type="button"
    aria-label="点一下，进入今天吃什么"
    onclick="window.dismissFoodQuote ? window.dismissFoodQuote() : (this.hidden = true, document.body.classList.remove('opening-active'))"
  >
    <span class="literary-quote-mark" aria-hidden="true">“</span>
    <span class="literary-quote" id="openingQuote">汤饼一杯银线乱，蒌蒿数箸玉簪横。</span>
    <span class="literary-source" id="openingSource">黄庭坚 · 《过土山寨》</span>
    <span class="literary-enter">点一下</span>
  </button>

  <div class="shell">
    <div class="desk">
      <main class="paper" aria-live="polite">
        <div class="inner">
          <section id="intro">
            <header class="mast">
              <div class="brand">
                <h1>先看你今儿啥锅，<br />然后再看你往里搁啥。</h1>
              </div>
              <div class="seal" aria-hidden="true">食命</div>
            </header>

            <div class="water-rule"><i></i></div>

            <div class="hero-copy">
              我管你爱吃辣还是喝汤呢？<br />先随便扯几句，看看你是哪口锅。
            </div>

            <aside class="shared-invite hidden" id="sharedInvite"></aside>

            <aside class="saved-profile hidden" id="savedProfile">
              <span class="saved-kicker">上回是这口锅</span>
              <strong id="savedTitle"></strong>
              <p id="savedAxes"></p>
            </aside>

            <div class="intro-actions">
              <button class="primary" id="startBtn">来，看看啥锅</button>
              <button class="primary hidden" id="resumeBtn">今天往锅里来一卦</button>
              <button class="text-button hidden" id="retestBtn">再来一锅</button>
            </div>
            <p id="introModeCopy" class="flow-compat"></p>
          </section>

          <section id="quiz" class="hidden">
            <div class="qmeta">
              <strong id="qStep">第 1 问 / 8</strong>
              <span id="qPhase" aria-hidden="true"></span>
            </div>
            <div class="progress" aria-hidden="true"><i id="prog"></i></div>
            <div class="question" id="qText"></div>
            <div class="hint" id="qHint"></div>
            <div class="choices" id="choices"></div>
            <button class="quiz-back" id="quizBackBtn">← 上一题</button>
          </section>

          <section id="conditions" class="hidden flow-compat" aria-hidden="true">
            <div id="softConditions"></div>
            <div id="hardConditions"></div>
            <button id="calculateBtn" type="button">继续</button>
            <button id="conditionBackBtn" type="button">返回</button>
          </section>

          <section id="loading" class="loading hidden">
            <div class="coin" aria-hidden="true">锅</div>
            <b>往吃的上拐呢……</b>
            <p id="loadingLine">先看看哪道菜最会来事。</p>
          </section>

          <section id="result" class="hidden">
            <div class="cert-head">
              <div class="cert-kicker">今日锅格</div>
              <div class="date-stamp" id="dateStamp"></div>
            </div>

            <div class="persona-card">
              <div class="persona-watermark" aria-hidden="true">命</div>
              <div class="persona-pot" id="personaPot"></div>
              <div class="persona-title" id="personaTitle"></div>
              <div class="persona-axes" id="personaAxes"></div>
              <p id="personaCaption"></p>
            </div>

            <div class="result-divider"><span>往锅里搁这个</span></div>

            <div class="meal" id="mealName"></div>
            <div class="meal-native" id="mealNative"></div>
            <div class="meal-sub" id="mealPills"></div>

            <div class="verdict">
              <div class="label">说人话</div>
              <p id="psychVerdict"></p>
            </div>

            <div class="crossings">
              <span>这几口锅也吃得通</span>
              <div class="cross-list" id="crossList"></div>
            </div>

            <div class="alts">
              <span>不想吃这个，就看旁边</span>
              <div class="alt-list" id="altList"></div>
            </div>

            <div class="flow-compat" aria-hidden="true">
              <div id="axisBars"></div>
              <p id="psychEvidence"></p>
              <p id="fortuneEvidence"></p>
              <p id="kitchenEvidence"></p>
              <p id="conEvidence"></p>
              <b id="confidence"></b>
              <i id="meterFill"></i>
              <span id="footNote"></span>
              <button id="copyResultBtn" type="button"></button>
            </div>

            <div class="actions">
              <button class="act main" id="acceptBtn">行，就它</button>
              <button class="act" id="rerollBtn">换一道</button>
              <button class="act share" id="shareImageBtn">发张图</button>
              <button class="act" id="restartDailyBtn">今天再算</button>
              <button class="act wide" id="resetProfileBtn">再来一锅</button>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="share-modal hidden" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-sheet">
      <div class="share-sheet-head">
        <h2 id="shareModalTitle">锅和菜，都画好了</h2>
        <button id="closeShareBtn" aria-label="关闭分享图">×</button>
      </div>
      <div class="share-preview-wrap">
        <div class="share-loading" id="shareStatus">正在画……</div>
        <img id="sharePreview" alt="锅格与今日菜品分享图" />
      </div>
      <div class="share-actions">
        <button class="act main" id="shareFileBtn">发出去</button>
        <button class="act" id="downloadBtn">存图片</button>
        <button class="act wide" id="copyLinkBtn">复制链接</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/literary-quotes-v5-1.js" defer></script>
  <script src="/literary-quotes-v5-2.js" defer></script>
  <script src="/literary-quotes-v5-3.js" defer></script>
  <script src="/literary-quotes-v5-4.js" defer></script>
  <script src="/literary-opening.js" defer></script>
  <script src="/food-data.js" defer></script>
  <script src="/food-policy.js" defer></script>
  <script src="/personality-engine.js" defer></script>
  <script src="/question-copy.js" defer></script>
  <script src="/qr-code.js" defer></script>
  <script src="/psychic-app.js" defer></script>
  <script src="/flow-lite.js" defer></script>
</body>
</html>
