<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="description" content="随便聊几句，猜一道菜，再画一张有点奇怪的图。" />
  <title>聊点什么 · 今天吃什么</title>
  <link rel="icon" href="/assets/icon-180.png" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/play-chat.css?v=42" />
</head>
<body>
  <main class="play-shell">
    <header class="play-header">
      <a class="home-link" href="/?intro=0">今天吃什么</a>
      <button class="text-button" id="resetChat" type="button">重新聊</button>
    </header>

    <section id="conversation" aria-labelledby="chatHeading">
      <div class="play-intro">
        <div>
          <span class="eyebrow">聊完，画一道菜。</span>
          <h1 id="chatHeading">随便聊聊，<br />看看吃什么。</h1>
          <p>说说今天，或者想到什么就说什么。</p>
        </div>
        <img class="opening-illustration" src="/assets/studio/noodle-print.webp" alt="" width="512" height="512" />
      </div>
      <ol id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></ol>
      <button id="changeOpener" class="text-button change-opener" type="button">换个话头</button>

      <form id="messageForm" class="message-form">
        <label class="sr-only" for="messageInput">想说的话</label>
        <div class="composer">
          <div id="composerInput" class="composer-input" data-value="">
            <textarea id="messageInput" rows="1" maxlength="1200" placeholder="比如：今天开了一天会。" aria-describedby="messageCount turnHint" enterkeyhint="send"></textarea>
          </div>
          <button id="sendMessage" class="button button-small" type="submit" disabled>发送</button>
        </div>
        <div class="composer-meta">
          <p id="turnHint" class="turn-hint">说一句就可以画，也可以再聊几句。</p>
          <span id="messageCount" class="counter">0 / 600</span>
        </div>
      </form>
      <button id="drawImage" class="button button-primary draw-button" type="button" disabled>就这些，画出来</button>
    </section>

    <section id="pictureResult" class="picture-result" aria-labelledby="foodName" hidden>
      <article class="picture-card">
        <header class="picture-heading">
          <p class="picture-label">今天吃什么</p>
          <h1 id="foodName"></h1>
          <p id="foodNative" class="food-native" hidden></p>
        </header>
        <figure class="picture-frame">
          <img id="foodPicture" alt="" width="1024" height="1536" />
          <figcaption class="picture-footer">
            <p id="pictureCaption" class="picture-caption"></p>
            <a class="picture-qr" id="pictureQRLink" href="/chat" target="_blank" rel="noopener noreferrer">
              <canvas id="pictureQR" width="180" height="180" aria-hidden="true"></canvas>
              <span>扫码也画一张</span>
            </a>
          </figcaption>
        </figure>
      </article>
      <div class="picture-actions">
        <button id="sharePicture" class="button button-primary" type="button" disabled>分享给朋友</button>
        <a id="savePicture" class="button" aria-disabled="true">保存分享图</a>
      </div>
      <p id="saveStatus" class="save-status" role="status"></p>
      <div class="picture-actions">
        <button id="newMismatch" class="button" type="button">同一道菜，再画一张</button>
        <button id="continueChat" class="button" type="button">继续聊</button>
      </div>
      <p id="pictureNote" class="picture-note">换个场景来画，食物还是这道。</p>
    </section>

    <section id="progressPanel" class="progress-panel" hidden>
      <div class="progress-heading">
        <p id="progressText" role="status"></p>
        <button id="cancelRequest" class="text-button" type="button">先不等了</button>
      </div>
      <div id="drawingProgress" class="drawing-progress" role="progressbar" aria-label="出图进度" hidden>
        <i></i><i></i>
      </div>
      <ul id="drawingNarration" class="drawing-narration" aria-live="polite" aria-relevant="additions"></ul>
    </section>

    <section id="errorPanel" class="error-panel" role="status" hidden>
      <p id="errorText"></p>
      <div class="error-actions">
        <button id="retryChat" class="text-button" type="button" hidden>查看回复</button>
        <button id="retryPicture" class="text-button" type="button" hidden>查看图片</button>
        <a id="fallbackLink" href="/?intro=0" hidden>先去随便选一道</a>
      </div>
    </section>
    <footer class="play-footer"><a href="/?intro=0">先去随便选一道</a></footer>
    <noscript><p class="error-panel">聊天需要开启 JavaScript。你也可以<a href="/?intro=0">回首页看看今天吃什么</a>。</p></noscript>
  </main>
  <script type="module" src="/chat.mjs?v=42"></script>
</body>
</html>
