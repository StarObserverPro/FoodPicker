<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="description" content="随便聊几句，让今晚的食物长出一点奇怪的想法。" />
  <title>聊点什么 · 今天吃什么</title>
  <link rel="icon" href="/assets/icon-180.png" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/play-chat.css?v=38" />
</head>
<body>
  <main class="play-shell">
    <header class="play-header">
      <a class="home-link" href="/?intro=0">今天吃什么</a>
      <button class="text-button" id="resetChat" type="button">重新聊</button>
    </header>

    <section id="conversation" aria-labelledby="chatHeading">
      <div class="play-intro">
        <span class="eyebrow">食物很正经，画面不一定。</span>
        <h1 id="chatHeading">聊几句，<br />整点怪的。</h1>
        <p>说说今天，或者想到什么就说什么。</p>
      </div>
      <ol id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></ol>
      <button id="changeOpener" class="text-button change-opener" type="button">换个话头</button>

      <form id="messageForm" class="message-form">
        <label class="sr-only" for="messageInput">想说的话</label>
        <textarea id="messageInput" rows="3" maxlength="1200" placeholder="比如：今天开了一天会，脑子快煮熟了。" aria-describedby="messageCount turnHint" enterkeyhint="send"></textarea>
        <div class="composer-bottom">
          <span id="messageCount" class="counter">0 / 600</span>
          <button id="sendMessage" class="button button-small" type="submit" disabled>发送</button>
        </div>
      </form>
      <p id="turnHint" class="turn-hint">聊一句也行，聊几句也行。</p>
      <button id="drawImage" class="button button-primary draw-button" type="button" disabled>就这些，画出来</button>
    </section>

    <section id="pictureResult" class="picture-result" aria-labelledby="foodName" hidden>
      <div class="picture-label">那今晚就吃——</div>
      <h1 id="foodName"></h1>
      <p id="foodNative" class="food-native" hidden></p>
      <figure class="picture-frame">
        <img id="foodPicture" alt="" width="1024" height="1536" />
      </figure>
      <p id="pictureCaption" class="picture-caption"></p>
      <div class="picture-actions">
        <button id="sharePicture" class="button button-primary" type="button">发给朋友</button>
        <button id="savePicture" class="button" type="button">保存图片</button>
        <button id="newMismatch" class="button" type="button">再拧一下 · 再画一张</button>
        <button id="continueChat" class="button" type="button">继续聊</button>
      </div>
      <p class="picture-note">菜还是这道菜，再画一张会换个奇怪的办法。</p>
    </section>

    <section id="progressPanel" class="progress-panel" aria-live="polite" hidden>
      <div class="progress-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <p id="progressText"></p>
      <button id="cancelRequest" class="text-button" type="button">停一下</button>
    </section>

    <section id="errorPanel" class="error-panel" role="status" hidden>
      <p id="errorText"></p>
      <div class="error-actions">
        <button id="retryChat" class="text-button" type="button" hidden>重试这句话</button>
        <button id="retryPicture" class="text-button" type="button" hidden>接着取这张图</button>
        <a id="fallbackLink" href="/?intro=0" hidden>先去随便选一道</a>
      </div>
    </section>
    <p id="saveStatus" class="save-status" role="status"></p>
    <footer class="play-footer"><a href="/?intro=0">先去随便选一道</a><span>聊到哪儿，画到哪儿。</span></footer>
    <noscript><p class="error-panel">聊天需要开启 JavaScript。你也可以<a href="/?intro=0">回首页看看今天吃什么</a>。</p></noscript>
  </main>
  <script type="module" src="/chat.mjs?v=38"></script>
</body>
</html>
