name: Import persona runtime art

on:
  push:
    branches:
      - agent/result-persona-art-oracle-r1

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-persona-art-oracle-r1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch approved runtime art
        run: |
          python -m pip install --quiet gdown
          rm -rf /tmp/foodpicker-drive
          mkdir -p /tmp/foodpicker-drive
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/12sbP-cQp1a0elLn1quFYELZ5Hd7MSt3j" -O /tmp/foodpicker-drive
      - name: Install runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/persona
          expected=(
            iron-peak-origin.webp
            iron-peak-transform.webp
            iron-ground-origin.webp
            iron-ground-transform.webp
            pan-peak.webp
            pan-ground.webp
            hotpot-peak.webp
            hotpot-ground.webp
            claypot-peak.webp
            claypot-ground.webp
            float-sprite.webp
          )
          for name in "${expected[@]}"; do
            src="$(find /tmp/foodpicker-drive -type f -name "RUNTIME_${name}" -print -quit)"
            if [ -z "$src" ]; then
              echo "missing RUNTIME_${name}" >&2
              exit 1
            fi
            cp "$src" "assets/persona/$name"
          done
      - name: Commit runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/persona
          if git diff --cached --quiet; then
            echo "runtime assets already current"
            exit 0
          fi
          git commit -m "Add approved persona result art assets"
          git push origin HEAD:agent/result-persona-art-oracle-r1
